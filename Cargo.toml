[package]
name = "ai-usagebar"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Omarchy/Waybar widgets + TUI for tracking multi-provider AI plan usage"
readme = "README.md"
repository = "https://github.com/akitaonrails/ai-usagebar"
homepage = "https://github.com/akitaonrails/ai-usagebar"
documentation = "https://github.com/akitaonrails/ai-usagebar#readme"
keywords = ["waybar", "claude", "openai", "tui", "usage"]
categories = ["command-line-utilities"]

# Don't ship screenshots (~6 MiB of the package!) or AUR packaging files
# in the crates.io tarball — they're for the GitHub README and AUR builds,
# not for consumers of the crate or its binaries.
exclude = [
    "screenshot.png",
    "screenshots/*",
    "packaging/*",
    ".github/*",
    ".claude/*",
]

# cargo-binstall metadata: tells `cargo binstall ai-usagebar` how to find the
# prebuilt binaries already published in each GitHub Release, so users without
# rustup don't need to compile from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ai-usagebar-linux-{ target-arch }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "ai_usagebar"
path = "src/lib.rs"

[[bin]]
name = "ai-usagebar"
path = "src/bin/ai-usagebar.rs"

[[bin]]
name = "ai-usagebar-tui"
path = "src/bin/ai-usagebar-tui.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process", "signal", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
fs2 = "0.4"
tempfile = "3"
directories = "6"
thiserror = "2"
ctrlc = "3"
base64 = "0.23"
# Electron/Chromium `safeStorage` crypto, used only to read the Claude Desktop
# app's own OAuth token out of its encrypted `config.json` (macOS). AES-128-CBC
# with a PBKDF2-HMAC-SHA1 key derived from a login-Keychain secret — the pure
# transform is cross-platform so it stays unit-testable on Linux CI.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
ratatui = "0.30.1"
ratatui-bubbletea-components = "0.2"
ratatui-bubbletea-theme = "0.2"
# Reads Cursor's local `state.vscdb` (its own on-disk session store) to find
# the OAuth token the Cursor IDE already wrote there. "bundled" statically
# links SQLite via cc, so no system libsqlite3-dev is required — keeping the
# AUR source build's hermeticity (see CLAUDE.md's release checklist).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# --- encrypted sync (src/sync/) ----------------------------------------------
# All six are pure Rust or vendor their C (zstd), so the AUR source build stays
# hermetic — no system libargon2/libsodium/libzstd, nothing to detect at
# configure time. `src/sync/crypto.rs` is the only module allowed to import
# argon2 or chacha20poly1305; a test in that file enforces it.
#
# Argon2id password KDF. `default-features = false` drops the PHC-string
# machinery (`password-hash`) deliberately: the format stores KDF *parameters*
# but never a verifier, because the AEAD tag is the verifier. Storing a hash
# next to the data would hand an offline attacker a plaintext-equivalent oracle.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# XChaCha20-Poly1305. The 192-bit nonce removes all nonce-budget accounting, so
# chunk nonces can be derived from the chunk id and the snapshot root can use a
# fresh random one with no counter to track.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Keyed hashing (chunk addressing) + `derive_key` (subkey derivation).
blake3 = { version = "1.8", default-features = false, features = ["std"] }
# Compression happens before encryption, so ciphertext stays incompressible.
zstd = "0.13"
zeroize = "1.9"
# The OS CSPRNG directly: 16 salt bytes, 24 nonce bytes, 32 master-key bytes.
# No `rand`, no ThreadRng, no reseeding.
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
mockito = "1"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
