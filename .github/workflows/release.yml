name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to build (e.g. v0.13.1)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  # Nothing verified that the artifacts about to be published carry the version
  # the tag claims. At v0.13.0 the packaging `.SRCINFO` files still said 0.8.0
  # while Cargo.toml said 0.13.0, and the release went out anyway. Everything
  # downstream depends on this job.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Tags are needed to prove a workflow_dispatch ref is a real tag.
          fetch-depth: 0

      - id: check
        name: Tag, manifests, changelog and packaging must agree
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          case "$ref" in
            v*) ;;
            *) echo "::error::refusing to publish from '$ref' — releases must build a vX.Y.Z tag"; exit 1 ;;
          esac
          version="${ref#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$ref' is not a vX.Y.Z tag"; exit 1
          fi
          # A workflow_dispatch ref must be an existing tag, not an arbitrary commit.
          git rev-parse -q --verify "refs/tags/$ref" >/dev/null \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }
          if [ "$(git cat-file -t "refs/tags/$ref")" != "tag" ]; then
            echo "::error::tag '$ref' is lightweight; releases require an annotated tag"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "refs/tags/$ref")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main \
            || { echo "::error::tag '$ref' does not point to a commit on main"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          check "Cargo.toml version" \
            "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$version"
          check "Omarchy plugin version" \
            "$(jq -r '.version' manifest.json)" "$version"
          check "PKGBUILD pkgver" \
            "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | cut -d= -f2)" "$version"
          check "PKGBUILD-bin pkgver" \
            "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD-bin | cut -d= -f2)" "$version"
          check ".SRCINFO pkgver" \
            "$(grep -m1 'pkgver = ' packaging/aur/.SRCINFO | awk '{print $3}')" "$version"
          check ".SRCINFO-bin pkgver" \
            "$(grep -m1 'pkgver = ' packaging/aur/.SRCINFO-bin | awk '{print $3}')" "$version"

          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  build:
    needs: [verify-version]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ai-usagebar-linux-x86_64
            builder: cargo
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: ai-usagebar-linux-aarch64
            builder: cross
          # Windows ships the tray host as well as the CLI/TUI. Besides the
          # zip, every exe is also published bare with a `.sha256` sidecar:
          # that is what the tray's self-updater downloads (src/update.rs),
          # so the bare-exe names here are a contract with `asset_name`.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-usagebar-windows-x86_64
            builder: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - name: Test desktop integration models
        if: runner.os == 'Linux'
        run: make desktop-test

      - name: Install nasm (x86_64 native build; ring assembles its primitives)
        if: runner.os == 'Linux' && matrix.builder == 'cargo'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install cross (aarch64 cross-compile via Docker)
        if: runner.os == 'Linux' && matrix.builder == 'cross'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cross

      - name: Test (native only — aarch64 binaries can't run on x86 runner)
        if: runner.os == 'Linux' && matrix.builder == 'cargo'
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Build release binaries
        if: runner.os == 'Linux'
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }} --locked

      - name: Create tarball (both bins + LICENSE + config example)
        if: runner.os == 'Linux'
        run: |
          STAGE=$(mktemp -d)
          cp target/${{ matrix.target }}/release/ai-usagebar \
             target/${{ matrix.target }}/release/ai-usagebar-tui \
             "$STAGE/"
          cp LICENSE README.md config.example.toml "$STAGE/"
          tar czf ${{ matrix.artifact }}.tar.gz -C "$STAGE" .
          rm -rf "$STAGE"

      - name: Compute SHA256
        if: runner.os == 'Linux'
        run: |
          SHA=$(sha256sum ${{ matrix.artifact }}.tar.gz | awk '{print $1}')
          echo "$SHA  ${{ matrix.artifact }}.tar.gz" > ${{ matrix.artifact }}.tar.gz.sha256
          echo "Built ${{ matrix.artifact }}.tar.gz sha256=$SHA"

      # --- Windows -------------------------------------------------------
      # Same nasm requirement as the Linux x86_64 build; the Windows runner
      # does not ship it on PATH either (mirrors .github/workflows/ci.yml).
      - name: Install nasm (Windows; ring assembles its primitives)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      # build.rs runs `npm run build` in windows/popover on Windows targets,
      # so the popover's dependencies must be installed before cargo runs.
      - name: Set up Node (Windows; the tray popover is a Vite build)
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/popover/package-lock.json

      - name: Install popover dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: windows/popover
        run: npm ci

      - name: Test desktop integration models (Windows; no make on the runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node gnome-extension/marker-logic.test.mjs
          node kde-plasmoid/plasmoid-logic.test.mjs
          node windows/popover/popover.test.mjs

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }} --locked

      # One zip for humans, plus the three bare exes with `.sha256` sidecars
      # for the tray's self-updater. Sidecars use the `sha256sum` layout
      # ("<hex>  <name>", two spaces) so the Linux and Windows checksums read
      # the same and `update::parse_sha256_sidecar` accepts both.
      - name: Package zip, bare exes and SHA256 sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = '${{ matrix.artifact }}'
          $arch = 'x86_64'
          $bins = 'target/${{ matrix.target }}/release'
          $binaries = @('ai-usagebar-tray', 'ai-usagebar', 'ai-usagebar-tui')

          function Write-Sidecar([string]$file) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            # Two spaces, LF, no BOM: byte-for-byte the `sha256sum` format.
            [System.IO.File]::WriteAllText("$file.sha256", "$hash  $name`n", [System.Text.UTF8Encoding]::new($false))
            Write-Host "Built $name sha256=$hash"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($bin in $binaries) {
            Copy-Item "$bins/$bin.exe" (Join-Path $stage "$bin.exe")
            Copy-Item "$bins/$bin.exe" "$bin-windows-$arch.exe"
            Write-Sidecar "$bin-windows-$arch.exe"
          }
          Copy-Item LICENSE, README.md, config.example.toml $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "$artifact.zip" -Force
          Write-Sidecar "$artifact.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          # Linux produces the tarball pair; Windows the zip, the bare exes
          # and their sidecars. Missing globs are fine (one OS each).
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            *-windows-x86_64.exe
            *-windows-x86_64.exe.sha256

  release:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    # Only this job publishes anything to the repo; the rest read.
    permissions:
      contents: write
    steps:
      - name: Checkout source (for CHANGELOG + previous tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release body
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # `-Fxv "$TAG"`: -F treats TAG as a fixed string (dots aren't regex
          # wildcards), -x requires whole-line match. Robust against the dots
          # in version strings like `v0.4.1`.
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -1)

          # Extract matching section from CHANGELOG.md (between "## [VERSION]"
          # and the next "## [" header). Empty file if no match.
          # `index(s, t) == 1` is a string prefix-equality match — no regex,
          # so dots in `ver` (e.g. `0.4.1`) stay literal.
          awk -v ver="$VERSION" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > changelog_section.md

          {
            if [ -s changelog_section.md ]; then
              echo "## What's changed"
              echo
              cat changelog_section.md
            fi

            echo "## Install"
            echo
            echo "### Arch (AUR)"
            echo
            echo '```bash'
            echo "yay -S ai-usagebar-bin      # prebuilt binary from this release"
            echo "yay -S ai-usagebar          # compiles from source"
            echo '```'
            echo
            echo "### Manual"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ai-usagebar-linux-x86_64.tar.gz | tar xz -C ~/.local/bin ai-usagebar ai-usagebar-tui"
            echo '```'
            echo
            echo "### Windows"
            echo
            echo "Unzip ai-usagebar-windows-x86_64.zip anywhere and run ai-usagebar-tray.exe (the zip also carries ai-usagebar.exe and ai-usagebar-tui.exe). The bare *-windows-x86_64.exe assets are what the tray's self-updater downloads; they are not needed by hand."
            echo
            echo "## Checksums (SHA256)"
            echo '```'
            # Every sidecar: the Linux tarballs, the Windows zip, and the
            # per-exe ones the self-updater verifies against. All use the
            # `sha256sum` layout, so they concatenate into one checkable block.
            cat artifacts/*.sha256
            echo '```'

            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi
          } > body.md

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          TAG="$RELEASE_REF"
          # Replace any pre-existing assets so re-runs (workflow_dispatch on
          # an existing tag) overwrite cleanly.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/*.exe artifacts/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          else
            gh release create "$TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/*.exe artifacts/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file body.md \
              --latest
          fi

  publish-crates-io:
    needs: [verify-version, build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.ref != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::Skipping crates.io publish — no CARGO_REGISTRY_TOKEN secret set"
            exit 0
          fi
          log="${RUNNER_TEMP:-/tmp}/cargo-publish.log"
          set +e
          cargo publish 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Idempotent re-runs: if the version is already on crates.io
          # (e.g. workflow_dispatch fired against an old tag), skip
          # quietly instead of failing the workflow.
          if grep -q "crate ai-usagebar@.* already exists on crates.io index" "$log"; then
            echo "::warning::Skipping crates.io publish — ${GITHUB_REF_NAME#v} already exists"
            exit 0
          fi
          exit "$status"

  publish-aur:
    needs: [verify-version, build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.ref != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Compute the real sha256s and inject them into both PKGBUILDs so the
      # AUR deploy action publishes pinned hashes (the in-tree PKGBUILDs
      # carry `SKIP` between releases by convention — see CLAUDE.md).
      - name: Pin sha256s in PKGBUILDs
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          SRC_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA=$(curl -fsSL "$SRC_URL" | sha256sum | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('$SRC_SHA')/" packaging/aur/PKGBUILD

          X86_SHA=$(awk '{print $1}' artifacts/ai-usagebar-linux-x86_64.tar.gz.sha256)
          ARM_SHA=$(awk '{print $1}' artifacts/ai-usagebar-linux-aarch64.tar.gz.sha256)
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$X86_SHA')/" packaging/aur/PKGBUILD-bin
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$ARM_SHA')/" packaging/aur/PKGBUILD-bin

          # deploy-aur copies pkgbuild verbatim (preserves filename). The AUR
          # bin repo tracks a file literally named `PKGBUILD`, so stage the
          # `-bin` variant under that name. Without this, makepkg generates
          # .SRCINFO from the stale PKGBUILD and pushes an empty commit (the
          # mode that bit us in v0.4.4 — see CHANGELOG).
          mkdir -p staging/bin
          cp packaging/aur/PKGBUILD-bin staging/bin/PKGBUILD

      - name: Check AUR_SSH_KEY presence
        id: aur_key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping AUR push — no AUR_SSH_KEY secret set"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      # `KSXGitHub/github-actions-deploy-aur` spins up an Arch container,
      # regenerates .SRCINFO via makepkg, then commits + pushes via SSH.
      # Pinned to an immutable revision because this action receives the AUR
      # SSH private key and executes in the release trust boundary.
      - name: Publish ai-usagebar (source) to AUR
        if: steps.aur_key.outputs.set == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ai-usagebar
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: AkitaOnRails (GitHub Actions)
          commit_email: boss@akitaonrails.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "ai-usagebar ${{ inputs.ref || github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: 'false'

      - name: Publish ai-usagebar-bin to AUR
        if: steps.aur_key.outputs.set == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ai-usagebar-bin
          pkgbuild: ./staging/bin/PKGBUILD
          commit_username: AkitaOnRails (GitHub Actions)
          commit_email: boss@akitaonrails.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "ai-usagebar-bin ${{ inputs.ref || github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          force_push: 'false'
